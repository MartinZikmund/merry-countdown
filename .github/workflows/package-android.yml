name: Build Android Packages

on:
  # Push to main: Dev-channel AAB (Dev applicationId, sideload-safe; no Play upload).
  # Push to release/v*: Prod-channel AAB uploaded to Google Play Production track.
  # Manual run: pick the channel and, for Prod, a Play track (none = artifact only, e.g. the first upload).
  # See docs/android-packaging.md and docs/versioning.md.
  push:
    branches:
      - "main"
      - "release/v**"
  workflow_dispatch:
    inputs:
      channel:
        description: App channel to package
        type: choice
        options: [Dev, Prod]
        default: Dev
      play_track:
        description: Google Play track for a Prod build (none = artifact only)
        type: choice
        options: [none, internal, alpha, beta, production]
        default: none

env:
  # App Configuration
  APP_NAME: MerryCountdown
  DOTNET_VERSION: 10.0.x
  SOLUTION_FILE: src/MerryCountdown.slnx
  PROJECT_PATH: src/MerryCountdown
  PROJECT_FILE: src/MerryCountdown/MerryCountdown.csproj
  ANDROID_TARGET_FRAMEWORK: net10.0-android

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.channel }}
  cancel-in-progress: true

jobs:
  build_android:
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    env:
      STEP_TIMEOUT_MINUTES: 60

      # .NET niceties
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      ContinuousIntegrationBuild: true

    steps:
      - name: Compute app channel
        id: channel
        shell: bash
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_PLAY_TRACK: ${{ inputs.play_track }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$INPUT_CHANNEL" == "Prod" ]]; then
            echo "value=Prod" >> "$GITHUB_OUTPUT"
            echo "package_name=dev.mzikmund.merrycountdown" >> "$GITHUB_OUTPUT"
            echo "play_track=${INPUT_PLAY_TRACK/none/}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" && "$GITHUB_REF" == refs/heads/release/v* ]]; then
            echo "value=Prod" >> "$GITHUB_OUTPUT"
            echo "package_name=dev.mzikmund.merrycountdown" >> "$GITHUB_OUTPUT"
            echo "play_track=production" >> "$GITHUB_OUTPUT"
          else
            echo "value=Dev" >> "$GITHUB_OUTPUT"
            echo "package_name=dev.mzikmund.merrycountdown.dev" >> "$GITHUB_OUTPUT"
            echo "play_track=" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Cache NuGet to speed up restores
      - name: NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.sln*', '**/*.csproj', '**/Directory.Packages.props', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            ${{ env.DOTNET_VERSION }}

      # An empty key builds fine but leaves the paywall unable to sell anything; testing tracks may do without.
      - name: Check the RevenueCat Android key
        if: steps.channel.outputs.play_track == 'production'
        shell: bash
        run: |
          if grep -q 'RevenueCatAndroidKey = "";' src/MerryCountdown/Services/Store/StoreConfig.cs; then
            echo "::error file=src/MerryCountdown/Services/Store/StoreConfig.cs::RevenueCatAndroidKey is empty, so a production release could not sell Pro."
            exit 1
          fi

      - name: Install .NET workloads
        run:
          dotnet workload restore "${{ env.SOLUTION_FILE }}"

      - name: Restore solution
        run: dotnet restore "${{ env.SOLUTION_FILE }}"

      # --- Signing setup (requires your keystore + secrets) ---
      # Create upload keystore file from a base64 secret
      - name: Decode Android upload keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/android-upload.keystore"

      # --- Build Google Play bundle (AAB) ---
      - name: Publish AAB (signed with Upload Key)
        run: |
          dotnet publish "${{ env.PROJECT_FILE }}" -c Release -f ${{ env.ANDROID_TARGET_FRAMEWORK }} \
            -p:AppChannel=${{ steps.channel.outputs.value }} \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$GITHUB_WORKSPACE/android-upload.keystore" \
            -p:AndroidSigningKeyAlias='${{ secrets.ANDROID_KEY_ALIAS }}' \
            -p:AndroidSigningKeyPass='${{ secrets.ANDROID_KEY_PASSWORD }}' \
            -p:AndroidSigningStorePass='${{ secrets.ANDROID_STORE_PASSWORD }}' \
            -p:AndroidPackageFormat=aab -p:PackageFormat=aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android_AAB_${{ steps.channel.outputs.value }}
          path: |
            ${{ env.PROJECT_PATH }}/bin/Release/${{ env.ANDROID_TARGET_FRAMEWORK }}/publish/*.aab

      # Play only takes draft releases until the app is first published: set the PLAY_RELEASE_STATUS
      # repository variable to "completed" after that, so releases roll out without a click.
      - name: Upload to Google Play Console
        if: steps.channel.outputs.value == 'Prod' && steps.channel.outputs.play_track != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ steps.channel.outputs.package_name }}
          releaseFiles: ${{ env.PROJECT_PATH }}/bin/Release/${{ env.ANDROID_TARGET_FRAMEWORK }}/publish/*-Signed.aab
          track: ${{ steps.channel.outputs.play_track }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}

      # Clean up keystore
      - name: Remove keystore
        if: ${{ always() }}
        run: rm -f "$GITHUB_WORKSPACE/android-upload.keystore"